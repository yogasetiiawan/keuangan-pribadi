name: Build iOS (.ipa) & Android (.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios_ipa:
    name: Compile File .IPA (untuk iPhone / iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Siapkan Folder iOS & Dependencies
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.keuangan.pribadi --project-name keuangan_pribadi .
          fi
          flutter pub get

      - name: Izinkan Koneksi HTTP Lokal (Info.plist)
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName KeuanganKu" ios/Runner/Info.plist || true

      - name: Build Aplikasi iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r KeuanganPribadi-iOS.ipa Payload

      - name: Upload File KeuanganPribadi-iOS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganPribadi-iOS-IPA
          path: KeuanganPribadi-iOS.ipa

  build_android_apk:
    name: Compile File KeuanganKu-Android.apk (untuk HP Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Siapkan Folder Android & Izin Internet
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.keuangan.pribadi --project-name keuangan_pribadi .
          fi
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml
          fi
          sed -i 's/android:label="keuangan_pribadi"/android:label="KeuanganKu"/' android/app/src/main/AndroidManifest.xml || true
          flutter pub get

      - name: Build KeuanganKu-Android.apk (Release)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk KeuanganKu-Android.apk

      - name: Upload File KeuanganKu-Android.apk
        uses: actions/upload-artifact@v4
        with:
          name: KeuanganKu-Android-APK
          path: KeuanganKu-Android.apk
